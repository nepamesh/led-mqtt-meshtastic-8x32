[platformio]
default_envs = esp32c6

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.6.0
    knolleary/PubSubClient@^2.8

#[env:esp32dev]
#platform = espressif32
#board = esp32dev
#extends = common

[env:esp32c6]
# pioarduino fork of espressif32 — ships arduino-esp32 3.x, which is required
# for ESP32-C6 Arduino framework support (official espressif32 only has espidf for C6).
# Check https://github.com/pioarduino/platform-espressif32/releases for latest tag.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-c6-devkitc-1
extends = common
# Override pioarduino's esptool with the already-installed tasmota v4.8.5.
# The pioarduino esptool zip references a package-postinstall.py that doesn't
# exist in the archive, causing PlatformIO to crash during install.
upload_protocol = espota
upload_port = 192.168.0.202
upload_flags =
    --auth=nepamesh
    --timeout=30
platform_packages =
    tool-esptoolpy @ symlink:///home/zero/.platformio/packages/tool-esptoolpy
